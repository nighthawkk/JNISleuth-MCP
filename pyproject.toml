[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jnisleuth-mcp"
version = "0.1.0"
description = "Automated RegisterNatives Recovery, Stripped ARM64 .so Type Reconstruction, and Unified Jadx + Ghidra MCP Server for Android Reverse Engineering."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "JNISleuth-MCP Contributors" }
]
keywords = ["android", "jni", "reverse-engineering", "ghidra", "jadx", "mcp", "arm64", "dobby"]
dependencies = []

[project.optional-dependencies]
full = [
    "fastmcp>=0.4.0",
    "lief>=0.14.0",
    "capstone>=5.0.0",
    "rich>=13.7.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jnisleuth = "jnisleuth.cli:main"
jnisleuth-mcp = "jnisleuth.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
